<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Practice Portal</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #16a34a;
      --success-hover: #15803d;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
    }

    body {
      /* Clear sans-serif font stack with extra character spacing for dyslexia accessibility */
      font-family: Arial, system-ui, -apple-system, sans-serif;
      letter-spacing: 0.03em;
      word-spacing: 0.08em;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 0.5rem;
    }

    .container {
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 500px;
      padding: 1.5rem;
      text-align: center;
      box-sizing: border-box;
    }

    /* Screen toggling structure */
    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    /* Start Screen Visual Enhancements */
    .welcome-icon {
      font-size: 4.5rem;
      margin-bottom: 0.5rem;
      line-height: 1;
    }

    .title {
      font-size: 1.85rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: 0.04em;
    }

    .subtitle {
      color: #475569;
      font-size: 1.1rem;
      margin-bottom: 2rem;
      line-height: 1.5;
      font-weight: 500;
    }

    .progress {
      font-size: 0.95rem;
      font-weight: 700;
      color: #64748b;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .image-container {
      width: 100%;
      height: 320px;
      border-radius: 12px;
      overflow: hidden;
      background-color: #f1f5f9;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: contain; /* Displays full image without cropping */
    }

    .phrase {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 1.25rem;
      color: var(--text);
      line-height: 1.3;
    }

    .audio-btn {
      background-color: #e0e7ff;
      color: #4338ca;
      border: none;
      border-radius: 50%;
      width: 72px;
      height: 72px;
      font-size: 2rem;
      cursor: pointer;
      margin-bottom: 1.5rem;
      transition: transform 0.1s ease, background-color 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .audio-btn:active {
      transform: scale(0.95);
      background-color: #c7d2fe;
    }

    .primary-btn {
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      width: 100%;
      padding: 1rem;
      font-size: 1.25rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s ease;
      letter-spacing: 0.05em;
    }

    .primary-btn:hover {
      background-color: var(--primary-hover);
    }

    /* Green GO Button for Start Page */
    .start-action-btn {
      background-color: var(--success);
      padding: 1.25rem 1rem;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      box-shadow: 0 4px 14px rgba(22, 163, 74, 0.35);
    }

    .start-action-btn:hover {
      background-color: var(--success-hover);
    }

    .btn-icon {
      font-size: 1.5rem;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 1. START / WELCOME SCREEN (Visual & Dyslexia Friendly) -->
    <div id="start-screen" class="screen active">
      <div class="welcome-icon" aria-hidden="true">💬</div>
      <h1 class="title">Speech Practice</h1>
      <p class="subtitle">Touch the green button to begin.</p>

      <button class="primary-btn start-action-btn" id="start-btn">
        <span class="btn-icon" aria-hidden="true">▶</span>
        <span>START</span>
      </button>
    </div>

    <!-- 2. PRACTICE CARD SCREEN -->
    <div id="practice-card" class="screen">
      <div class="progress" id="progress-text">Item 1 of 13</div>
      
      <div class="image-container">
        <img id="display-image" src="" alt="Practice Visual Aid">
      </div>
      
      <div class="phrase" id="display-phrase">---</div>
      
      <div>
        <button class="audio-btn" id="audio-btn" title="Listen to Phrase">🔊</button>
      </div>

      <button class="primary-btn" id="next-btn">Next Phrase ➔</button>
    </div>

    <!-- 3. COMPLETION SCREEN -->
    <div id="completion-screen" class="screen">
      <div class="welcome-icon" aria-hidden="true">🎉</div>
      <h2 class="title">All Done!</h2>
      <p class="subtitle">Great job finishing today's practice session.</p>
      <button class="primary-btn start-action-btn" id="restart-btn">
        <span class="btn-icon" aria-hidden="true">🔄</span>
        <span>Practice Again</span>
      </button>
    </div>

  </div>

  <script>
    // =========================================================================
    // EDITABLE DICTIONARY / ITEM LIST
    // =========================================================================
    const practiceDictionary = [
      {
        id: "1",
        phrase: "Come here please.",
        image: "images/Come_Here_Please.jpg"
      },
      {
        id: "2",
        phrase: "Give me the remote.",
        image: "images/Give_Me_The_Remote.jpg"
      },
      {
        id: "3",
        phrase: "Good morning.",
        image: "images/Good_Morning.jpg"
      },
      {
        id: "4",
        phrase: "Good night.",
        image: "images/Good_Night.jpg"
      },
      {
        id: "5",
        phrase: "How are you?",
        image: "images/How_Are_You.jpg"
      },
      {
        id: "6",
        phrase: "How was work?",
        image: "images/How_Was_Work.jpg"
      },
      {
        id: "7",
        phrase: "I am hungry.",
        image: "images/I_Am_Hungry.jpg"
      },
      {
        id: "8",
        phrase: "I am okay.",
        image: "images/I_Am_Okay.jpg"
      },
      {
        id: "9",
        phrase: "I love you.",
        image: "images/I_Love_You.jpg"
      },
      {
        id: "10",
        phrase: "I need help.",
        image: "images/I_Need_Help.jpg"
      },
      {
        id: "11",
        phrase: "Thank you so much!",
        image: "images/Thank_You_So_Much.jpg"
      },      
      {
        id: "12",
        phrase: "Turn on the TV.",
        image: "images/Turn_On_The_TV.jpg"
      },
      {
        id: "13",
        phrase: "Where are you going?",
        image: "images/Where_Are_You_Going.jpg"
      },
      {
        id: "14",
        phrase: "Are you blind, ref?",
        image: "images/Are_You_Blind_Ref.jpg"
      },
      {
        id: "15",
        phrase: "Great catch!",
        image: "images/Great_Catch.jpg"
      },
      {
        id: "16",
        phrase: "Great goal!",
        image: "images/Great_Goal.jpg"
      },
      {
        id: "17",
        phrase: "Man up!",
        image: "images/Man_UP.jpg"
      },
      {
        id: "18",
        phrase: "Run!",
        image: "images/Run.jpg"
      },
      {
        id: "19",
        phrase: "Take a shot!",
        image: "images/Take_A_Shot.jpg"
      }
    ];

    // =========================================================================
    // APPLICATION LOGIC
    // =========================================================================
    let queue = [];
    let currentIndex = 0;

    // Screens
    const startScreen = document.getElementById('start-screen');
    const practiceCard = document.getElementById('practice-card');
    const completionScreen = document.getElementById('completion-screen');

    // Elements
    const progressEl = document.getElementById('progress-text');
    const imageEl = document.getElementById('display-image');
    const phraseEl = document.getElementById('display-phrase');
    
    // Buttons
    const startBtn = document.getElementById('start-btn');
    const audioBtn = document.getElementById('audio-btn');
    const nextBtn = document.getElementById('next-btn');
    const restartBtn = document.getElementById('restart-btn');

    // Fisher-Yates Shuffle algorithm
    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Screen switcher helper
    function showScreen(screenToShow) {
      startScreen.classList.remove('active');
      practiceCard.classList.remove('active');
      completionScreen.classList.remove('active');
      
      screenToShow.classList.add('active');
    }

    // Reset view to Welcome Screen
    function resetToHome() {
      window.scrollTo(0, 0);
      showScreen(startScreen);
    }

    // Begin session
    function startPracticeSession() {
      queue = shuffle(practiceDictionary);
      currentIndex = 0;
      renderCurrentItem();
      showScreen(practiceCard);
    }

    function renderCurrentItem() {
      const currentItem = queue[currentIndex];
      progressEl.textContent = `Item ${currentIndex + 1} of ${queue.length}`;
      phraseEl.textContent = currentItem.phrase;
      imageEl.src = currentItem.image;
      imageEl.alt = currentItem.phrase;
    }

    // SpeechSynthesis API (Built-in TTS)
    function playAudio() {
      const currentItem = queue[currentIndex];
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        
        const utterance = new SpeechSynthesisUtterance(currentItem.phrase);
        utterance.rate = 0.3; 
        utterance.pitch = 1;
        
        window.speechSynthesis.speak(utterance);
      } else {
        alert("Sorry, text-to-speech is not supported in this browser.");
      }
    }

    function handleNext() {
      if (currentIndex < queue.length - 1) {
        currentIndex++;
        renderCurrentItem();
      } else {
        showScreen(completionScreen);
      }
    }

    // Event Listeners
    startBtn.addEventListener('click', startPracticeSession);
    audioBtn.addEventListener('click', playAudio);
    nextBtn.addEventListener('click', handleNext);
    restartBtn.addEventListener('click', startPracticeSession);

    // Forces return to the Start Screen whenever the link is opened
    window.addEventListener('pageshow', resetToHome);
  </script>
</body>
</html>
